<!DOCTYPE html>
<html>
<head>
    <title>Emma's Garden Journey</title>

    <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Using the Green (45% sat) and Blue/Cyan hierarchy rules for a soft, natural backdrop */
        background: linear-gradient(to bottom, hsl(195, 35%, 93%), hsl(110, 45%, 92%), hsl(110, 45%, 85%));
        font-family: 'Trebuchet MS', sans-serif;
    }

    .card {
        background: white;
        padding: 50px;
        border-radius: 30px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
        /* Grounded in the Red spectrum (approx 34% saturation) for a warm, high-contrast title */
        color: hsl(0, 34%, 30%);
    }

    p {
        color: hsl(0, 10%, 30%);
        font-size: 18px;
    }

    button {
        margin-top: 20px;
        padding: 15px 35px;
        border: none;
        border-radius: 15px;
        font-size: 22px;
        font-weight: bold;
        /* Highest preference: Orange with 35% saturation (Medium Saturation range) */
        background: hsl(25, 35%, 55%);
        color: white;
        cursor: pointer;
        transition: background 0.2s ease;
        box-shadow: 0 4px 15px rgba(214, 110, 31, 0.3);
    }

    button:hover {
        /* Transitions into Yellow-Orange (approx 32% saturation) */
        background: hsl(40, 32%, 50%);
        box-shadow: 0 4px 20px rgba(204, 133, 31, 0.4);
    }
    </style>

</head>

<body>

<div class="card">

    <h1>🌸 Emma's Garden Journey 🌸</h1>

    <p>
        Help Emma through a series of memory activities.
    </p>

    <button onclick="location.href='GAME1.html'">
        Start Journey
    </button>

</div>

</body>
</html>
